services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nubagz
      POSTGRES_USER: nubagz
      POSTGRES_PASSWORD: nubagz
    volumes:
      - nubagz_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nubagz -d nubagz"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://nubagz:nubagz@db:5432/nubagz
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-before-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_KEY_ID: ${JWT_KEY_ID:-nubagz-1}
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      PRIVY_VERIFICATION_KEY: ${PRIVY_VERIFICATION_KEY:-}
      EVM_RPC_ROBINHOOD: ${EVM_RPC_ROBINHOOD:-https://rpc.mainnet.chain.robinhood.com}
      EVM_RPC_AVALANCHE: ${EVM_RPC_AVALANCHE:-}
      EVM_RPC_ETHEREUM: ${EVM_RPC_ETHEREUM:-}
      EVM_RPC_BASE: ${EVM_RPC_BASE:-}
      EVM_RPC_ARBITRUM: ${EVM_RPC_ARBITRUM:-}
      EVM_RPC_POLYGON: ${EVM_RPC_POLYGON:-}
      ZEROX_API_KEY: ${ZEROX_API_KEY:-}
      LIFI_API_KEY: ${LIFI_API_KEY:-}
      LIFI_INTEGRATOR: ${LIFI_INTEGRATOR:-nubagz}
      NUBAGZ_SWAP_FEE_BPS: ${NUBAGZ_SWAP_FEE_BPS:-75}
      NUBAGZ_SWAP_FEE_RECIPIENT: ${NUBAGZ_SWAP_FEE_RECIPIENT:-}
      SWAP_PROVIDER_BASE_URL: ${SWAP_PROVIDER_BASE_URL:-}
      SWAP_PROVIDER_API_KEY: ${SWAP_PROVIDER_API_KEY:-}
      GAS_SPONSOR_PROVIDER_BASE_URL: ${GAS_SPONSOR_PROVIDER_BASE_URL:-}
      GAS_SPONSOR_PROVIDER_API_KEY: ${GAS_SPONSOR_PROVIDER_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_PRIVY_APP_ID: ${VITE_PRIVY_APP_ID:-}
        VITE_PRIVY_CLIENT_ID: ${VITE_PRIVY_CLIENT_ID:-}
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  nubagz_db:
