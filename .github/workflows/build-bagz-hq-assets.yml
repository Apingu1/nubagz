name: Build Bag Z HQ assets

on:
  push:
    branches: [feature/bag-z-art-pack]
    paths:
      - '.bagz_hq/READY'

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode high-resolution Bag Z variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontend/public/bag-z
          for name in base hello detective wallet loot security warning confused sleepy victory; do
            cat .bagz_hq/${name}.*.part | tr -d '\n\r' | base64 -d > frontend/public/bag-z/${name}.avif
            test -s frontend/public/bag-z/${name}.avif
          done
      - name: Commit generated binary assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f .bagz_hq/*.part
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/bag-z .bagz_hq
          git commit -m 'Replace Bag Z artwork with 720px HQ AVIF variants'
          git push
