name: NuBagz CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: nubagz-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: Verify authoritative premium Bag Z delivery pack
        run: node scripts/prepare-bag-z.mjs dist/bag-z-premium
      - name: Build production frontend container
        run: docker build -t nubagz-frontend-ci .

  runtime-safety:
    name: Phase 0 runtime safety checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Bash safety scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n run_stack.sh
          for script in scripts/*.sh; do
            echo "syntax: ${script}"
            bash -n "$script"
          done

      - name: Verify local secrets and backups are ignored
        shell: bash
        run: |
          set -euo pipefail
          touch .env
          mkdir -p backups
          touch backups/ci-safety.dump
          git check-ignore -q .env
          git check-ignore -q backups/ci-safety.dump
          rm -f .env backups/ci-safety.dump

      - name: Exercise environment bootstrap without printing secrets
        shell: bash
        env:
          ZEROX_API_KEY: ci-placeholder-0x-key
          LIFI_API_KEY: ci-placeholder-lifi-key
          NUBAGZ_SWAP_FEE_RECIPIENT: '0x1111111111111111111111111111111111111111'
        run: |
          set -euo pipefail
          bash scripts/bootstrap_env.sh
          test -f .env
          grep -q '^JWT_AUDIENCE=' .env
          grep -q '^ADMIN_SECURITY_KEY=.' .env
          grep -q '^ZEROX_API_KEY=' .env
          grep -q '^LIFI_API_KEY=' .env
          grep -q '^NUBAGZ_SWAP_FEE_RECIPIENT=' .env
          git check-ignore -q .env

      - name: Run non-destructive runtime preflight
        shell: bash
        run: bash scripts/runtime_check.sh --preflight

  runtime-smoke:
    name: production runtime smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend, runtime-safety]
    steps:
      - uses: actions/checkout@v4

      - name: Create disposable CI RS256 and Admin security keys
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/nubagz-ci-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/nubagz-ci-private.pem -pubout -out /tmp/nubagz-ci-public.pem >/dev/null 2>&1
          private_key="$(awk '{printf "%s\\n", $0}' /tmp/nubagz-ci-private.pem)"
          public_key="$(awk '{printf "%s\\n", $0}' /tmp/nubagz-ci-public.pem)"
          {
            echo 'JWT_ALGORITHM=RS256'
            echo 'JWT_AUDIENCE=nubagz-api'
            echo "JWT_PRIVATE_KEY=${private_key}"
            echo "JWT_PUBLIC_KEY=${public_key}"
            echo 'ADMIN_SECURITY_KEY=ci-phase25-admin-security-key-not-for-production'
          } >> "$GITHUB_ENV"

      - name: Build and start the real production stack
        run: docker compose up -d --build --remove-orphans

      - name: Wait for web root and API
        shell: bash
        run: |
          set -euo pipefail
          root_code="000"
          health_code="000"

          for _ in $(seq 1 60); do
            root_code="$(curl -sS -o /tmp/nubagz-root.html -w '%{http_code}' http://127.0.0.1:8080/ || true)"
            health_code="$(curl -sS -o /tmp/nubagz-health.json -w '%{http_code}' http://127.0.0.1:8080/api/health || true)"
            if [[ "$root_code" == "200" && "$health_code" == "200" ]]; then
              break
            fi
            sleep 2
          done

          test "$root_code" = "200"
          test "$health_code" = "200"
          grep -q '<title>NuBagz' /tmp/nubagz-root.html
          grep -q '"status":"ok"' /tmp/nubagz-health.json
          grep -q '"version":"1.33.0"' /tmp/nubagz-health.json

      - name: Verify Phase 2.5 migration state
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T api alembic current | grep -q '20260830_0004'
          for table in user_sessions privy_identity_bindings admin_user_actions user_reward_holds admin_mfa_credentials admin_privilege_sessions admin_audit_events; do
            test "$(docker compose exec -T db psql -U nubagz -d nubagz -tAc "SELECT COUNT(*) FROM information_schema.tables WHERE table_name='${table}';" | tr -d '[:space:]')" = "1"
          done
          test "$(docker compose exec -T db psql -U nubagz -d nubagz -tAc "SELECT COUNT(*) FROM information_schema.columns WHERE table_name='users' AND column_name='account_state';" | tr -d '[:space:]')" = "1"
          test "$(docker compose exec -T db psql -U nubagz -d nubagz -tAc "SELECT COUNT(*) FROM information_schema.columns WHERE table_name='wallet_connections' AND column_name='is_primary_interactive';" | tr -d '[:space:]')" = "1"

      - name: Verify database checkpoint path
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/backup_db.sh CI_RUNTIME
          dump="$(find backups -maxdepth 1 -type f -name '*.dump' | head -n 1)"
          test -n "$dump"
          test -s "$dump"
          test -s "${dump}.sha256"
          bash scripts/verify_backup.sh "$dump"

      - name: Verify V2 SPA routes and exact premium mascot assets
        shell: bash
        run: |
          set -euo pipefail

          for route in / /login /register /app /app/work /app/bag /app/trust /app/studio /app/swaps /app/admin /app/admin/users /app/admin/users/1 /app/admin/security; do
            code="$(curl -sS -o /tmp/spa-route.html -w '%{http_code}' "http://127.0.0.1:8080${route}")"
            echo "${route} -> ${code}"
            test "$code" = "200"
            grep -q '<title>NuBagz' /tmp/spa-route.html
          done

          declare -A expected=(
            [base]=7b3ead2c8693fee55e4ed1321b026ce361f2da460dfee7afc6a048cedf3a979d
            [hello]=bc973909a7a88b17cc248c6586674720864f0323d6a5745eb029217375ed59e1
            [detective]=57c53de5bf3f064f6e8bc1b1db3c0222f4de259094aa13887d0e0c97469976b6
            [wallet]=47b98f02e0c0a5598bce91a92b20104216ddc8ac83d1120a883367f279e79979
            [loot]=34aee69704955aeb0932e1b61befd047371d3219fdaa0ce58905a1924d87d993
            [security]=fa24ac97d0e31bf96f683d8d3903a0a4e0a3db30c4471859efe6831c5bbc2700
            [warning]=33d5faa6ab2a1e310a54453f170a30b990511a17f6134118b9fdf411f855f818
            [confused]=785629cec729864746d05c7bab908fe9c115cf51171c5b8242c1df80ae512216
            [sleepy]=27bae69bcc081601e487c07ea6a502ddade41b106382028f4285fa5eb5160c95
            [victory]=c951fbc5385b1997efb39b6ef0593ce5e481f9c693501d301233dd91bb490161
          )

          for variant in base hello detective wallet loot security warning confused sleepy victory; do
            file="/tmp/${variant}.avif"
            code="$(curl -sS -o "$file" -w '%{http_code}' "http://127.0.0.1:8080/bag-z-premium/${variant}.avif")"
            echo "Bag Z ${variant} -> ${code}"
            test "$code" = "200"
            actual="$(sha256sum "$file" | awk '{print $1}')"
            test "$actual" = "${expected[$variant]}"
          done

      - name: Print production logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=250

      - name: Stop disposable CI production stack
        if: always()
        # CI uses a disposable database volume, so removing it here is intentional.
        run: docker compose down -v --remove-orphans
