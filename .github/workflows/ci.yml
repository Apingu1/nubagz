name: NuBagz CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: nubagz-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: Verify bespoke premium Bag Z delivery pack
        run: |
          set -euo pipefail
          for variant in base hello detective wallet loot security warning confused sleepy victory; do
            test -s "dist/bag-z-premium/${variant}.webp"
          done
      - name: Build production frontend container
        run: docker build -t nubagz-frontend-ci .

  runtime-smoke:
    name: production runtime smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the real production stack
        run: docker compose up -d --build --remove-orphans

      - name: Wait for web root and API
        shell: bash
        run: |
          set -euo pipefail
          root_code="000"
          health_code="000"

          for attempt in $(seq 1 60); do
            root_code="$(curl -sS -o /tmp/nubagz-root.html -w '%{http_code}' http://127.0.0.1:8080/ || true)"
            health_code="$(curl -sS -o /tmp/nubagz-health.json -w '%{http_code}' http://127.0.0.1:8080/api/health || true)"

            if [[ "$root_code" == "200" && "$health_code" == "200" ]]; then
              break
            fi

            echo "Attempt ${attempt}: / -> ${root_code}, /api/health -> ${health_code}"
            sleep 2
          done

          echo "Final status: / -> ${root_code}, /api/health -> ${health_code}"
          test "$root_code" = "200"
          test "$health_code" = "200"
          grep -q '<title>NuBagz' /tmp/nubagz-root.html
          grep -q '"status":"ok"' /tmp/nubagz-health.json

      - name: Verify SPA fallback routes and premium mascot assets
        shell: bash
        run: |
          set -euo pipefail

          for route in /login /register /discover /my-bag /project-trust; do
            code="$(curl -sS -o /tmp/spa-route.html -w '%{http_code}' "http://127.0.0.1:8080${route}")"
            echo "${route} -> ${code}"
            test "$code" = "200"
            grep -q '<title>NuBagz' /tmp/spa-route.html
          done

          for variant in base hello detective wallet loot security warning confused sleepy victory; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/bag-z-premium/${variant}.webp")"
            echo "Bag Z ${variant} -> ${code}"
            test "$code" = "200"
          done

      - name: Print production logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=250

      - name: Stop production stack
        if: always()
        run: docker compose down -v --remove-orphans
